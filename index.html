<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Tram Party 2026</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 動態背景影片 -->
    <video autoplay muted loop id="bg-video">
        <source src="bg-video.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div id="container">
        <!-- 第 1 頁：加入飛入動畫 -->
        <section id="page-1" class="page active">
            <div class="ticket-wrapper">
                <img src="Copilot_20260719_184520.png" alt="Tram Ticket" class="vintage-ticket-img">
                <button id="btn-accept" class="neon-btn red-neon">ACCEPT INVITATION</button>
                <div id="stamp" class="stamp hidden">CONFIRMED</div>
            </div>
        </section>

        <!-- 第 2-7 頁：移除 hidden，使用 CSS 處理隱藏 -->
        <section id="page-2" class="page">
            <h2>THE RENDEZVOUS</h2>
            <!-- (內容同上，此處省略以保持簡潔) -->
            <button class="neon-btn green-neon next-btn" data-next="page-3">PROCEED</button>
        </section>
        <!-- (請確保 Page 3 到 Page 7 的 class 只有 "page") -->
    </div>
    <script src="script.js"></script>
</body>
</html>
