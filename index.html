<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tram Party 2026 | RSVP</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@300;400;700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="bg-video.mp4" type="video/mp4">
    </video>

    <div id="container">
        <!-- P1: Invitation -->
        <section id="page-1" class="page active">
            <div class="ticket-wrapper">
                <img src="Copilot_20260719_184520.png" class="vintage-ticket-img">
                <input type="text" id="name" placeholder="Your Name" required>
                <button id="btn-accept" class="neon-btn">ACCEPT INVITATION</button>
                <div id="stamp" class="stamp hidden">CONFIRMED</div>
            </div>
        </section>

        <!-- P2: Phone -->
        <section id="page-2" class="page">
            <h2>GUEST DOSSIER</h2>
            <p>WhatsApp Number (8 digits)</p>
            <input type="tel" id="phone" placeholder="12345678" maxlength="8">
            <button class="neon-btn next-btn" data-next="page-3">NEXT</button>
        </section>

        <!-- P3: Food -->
        <section id="page-3" class="page">
            <h2>LATE NIGHT CRAVINGS</h2>
            <div class="checkbox-group">
                <label><input type="checkbox" name="food" value="Dim Sum"> Dim Sum</label>
                <label><input type="checkbox" name="food" value="Italian"> Italian</label>
                <label><input type="checkbox" name="food" value="Sushi"> Sushi</label>
                <label><input type="checkbox" name="food" value="Other" id="other-check"> Other</label>
                <input type="text" id="other-food" placeholder="Please specify..." style="display:none;">
            </div>
            <button class="neon-btn next-btn" data-next="page-4">NEXT</button>
        </section>

        <!-- P4: Drink -->
        <section id="page-4" class="page">
            <h2>POISON OF CHOICE</h2>
            <div class="range-container">
                <input type="range" id="drink-level" min="0" max="2" value="0">
                <div class="range-labels">
                    <span>Maybe next time</span><span>A bit tipsy</span><span>Alcoholic</span>
                </div>
            </div>
            <button class="neon-btn next-btn" data-next="page-5">NEXT</button>
        </section>

        <!-- P5: Vinyl Request -->
        <section id="page-5" class="page">
            <h2>TRACK REQUEST</h2>
            <video autoplay muted loop playsinline class="vinyl-video">
                <source src="vinyl-video.mp4" type="video/mp4">
            </video>
            <input type="text" id="song" placeholder="Your favorite song...">
            <button class="neon-btn next-btn" data-next="page-6" id="submit-btn">SUBMIT</button>
        </section>

        <!-- P6: Thanks -->
        <section id="page-6" class="page" data-bg="thanks-video.mp4">
            <h2>YOU ARE ALL SET!</h2>
            <p>Thank you for joining our cinematic night. We look forward to seeing you on board.</p>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
