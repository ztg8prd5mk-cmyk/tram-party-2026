<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hong Kong Tram Party 2026</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+HK:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <video autoplay muted loop id="bg-video"><source src="bg-video.mp4" type="video/mp4"></video>

    <div id="container">
        <!-- P1: 蓋章動畫 -->
        <section id="page-1" class="page active">
            <div class="ticket-wrapper">
                <img src="Copilot_20260719_184520.png" class="vintage-ticket-img">
                <input type="text" id="name" placeholder="請輸入名字...">
                <button id="btn-accept" class="neon-btn">ACCEPT INVITATION</button>
                <div id="stamp" class="stamp hidden">CONFIRMED</div>
            </div>
        </section>

        <!-- P2: 電話號碼 -->
        <section id="page-2" class="page">
            <h2>GUEST DOSSIER</h2>
            <input type="tel" id="phone" placeholder="WhatsApp 電話號碼">
            <button class="neon-btn next-btn" data-next="page-3">NEXT</button>
        </section>

        <!-- P3: 食物選擇 (限選二) -->
        <section id="page-3" class="page">
            <h2>LATE NIGHT CRAVINGS</h2>
            <div class="checkbox-group">
                <label><input type="checkbox" name="food" value="Dim Sum"> 港式點心</label>
                <label><input type="checkbox" name="food" value="Italian"> 義式料理</label>
                <label><input type="checkbox" name="food" value="Sushi"> 壽司</label>
                <label><input type="checkbox" name="food" value="Other" id="other-check"> 其他</label>
                <input type="text" id="other-text" class="hidden" placeholder="請填寫...">
            </div>
            <button class="neon-btn next-btn" data-next="page-4">NEXT</button>
        </section>

        <!-- P4: 酒水選擇 -->
        <section id="page-4" class="page">
            <h2>POISON OF CHOICE</h2>
            <div class="radio-group">
                <label><input type="radio" name="drink" value="No"> Maybe next time</label>
                <label><input type="radio" name="drink" value="Tipsy"> A little bit tipsy</label>
                <label><input type="radio" name="drink" value="Alcoholic"> Alcoholic</label>
            </div>
            <button class="neon-btn next-btn" data-next="page-5">NEXT</button>
        </section>

        <!-- P5: CD 播放器 -->
        <section id="page-5" class="page">
            <h2>TRACK REQUEST</h2>
            <div class="vinyl-player">
                <div class="vinyl"></div>
            </div>
            <input type="text" id="song" placeholder="心儀歌曲...">
            <button class="neon-btn next-btn" data-next="page-6">SUBMIT</button>
        </section>

        <!-- P6: 感謝訊息 -->
        <section id="page-6" class="page">
            <h2>SEE YOU ON BOARD</h2>
            <div class="summary-box">
                <p>感謝您的預約，我們 22/8 見！</p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
